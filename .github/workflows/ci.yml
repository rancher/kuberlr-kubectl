name: CI tests

on:
  push:
    branches:
      - main
      - release/v[0-9]+.(0|x)
      - release/v[0-9]+.[0-9]+.(0|x)
      - release/v[0-9]+.[0-9]+.[0-9]+
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
      - '../CODEOWNERS'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
      - '../CODEOWNERS'
      - 'LICENSE'

permissions:
  contents: write
  id-token: write
  packages: write
  attestations: write

jobs:
  ci:
    uses: rancher/kuberlr-kubectl/.github/workflows/ci.yml@automation-core
