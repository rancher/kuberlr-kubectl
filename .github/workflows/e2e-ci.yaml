name: "E2E CI"

on:
  workflow_dispatch:
    inputs:
      debug:
        description: "Enable debug logs"
        required: false
        default: "false"
      k3s_version:
        description: "Version of k3s to use for the underlying cluster, should exist in https://hub.docker.com/r/rancher/k3s/tags"
        required: false
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
      - '../CODEOWNERS'
      - 'LICENSE'
      - 'Makefile'
  push:
    branches:
      - main
      - release/v[0-9]+.x
      - release/v[0-9]+.[0-9]+.[0-9]+
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
      - '../CODEOWNERS'
      - 'LICENSE'

permissions:
  contents: write
  id-token: write
  packages: write
  attestations: write

jobs:
  e2e:
    uses: rancher/kuberlr-kubectl/.github/workflows/e2e-ci.yaml@automation-core
    with:
      debug: ${{ inputs.debug }}
      k3s_version: ${{ inputs.k3s_version }}
