name: Branch head Prerelease Images

on:
  push:
    branches:
      - main
      - release/v[0-9]+.x

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # Upload artefacts to release.

env:
  PUBLIC_REGISTRY: ghcr.io

jobs:
  prebuild-env:
    name: Prebuild needed Env vars
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository to the runner
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set Branch Tag and Other Variables
        id: set-vars
        uses: rancher/kuberlr-kubectl/.github/actions/compute-branch-tags@automation-core
    outputs:
      branch_tag: ${{ steps.set-vars.outputs.branch_tag }}
      branch_static_tag: ${{ steps.set-vars.outputs.branch_static_tag }}
      prev_tag: ${{ steps.set-vars.outputs.prev_static_tag }}

  publish-public:
    permissions:
      contents: read
      # write is needed for:
      # - OIDC for cosign's use in ecm-distro-tools/publish-image.
      # - Read vault secrets in rancher-eio/read-vault-secrets.
      # - Publish image to ghcr.io
      id-token: write
      packages: write
      attestations: write

    runs-on: ubuntu-latest
    needs:
      - prebuild-env
    steps:
      - name: Check out repository code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Load Secrets from Vault
        uses: rancher-eio/read-vault-secrets@0da85151ad1f19ed7986c41587e45aac1ace74b6 # v3
        with:
          secrets: |
            secret/data/github/repo/${{ github.repository }}/dockerhub/rancher/credentials username | DOCKER_USERNAME ;
            secret/data/github/repo/${{ github.repository }}/dockerhub/rancher/credentials password | DOCKER_PASSWORD ;

      # SLSA attestation stays on the release branch (OIDC binding requirement):
      # this step's cosign sign/attest calls are bound to the identity of
      # whichever workflow file runs this job, so this job cannot be
      # delegated to a reusable workflow on automation-core.
      - name: Build and push all image variations
        uses: rancher/ecm-distro-tools/actions/publish-image@fdf1c26ea7f6c61b1cc8496a393788d9e9246b98 # v0.77.3
        with:
          image: ${{ vars.IMAGE_NAME || 'kuberlr-kubectl' }}
          tag: ${{ needs.prebuild-env.outputs.branch_static_tag }}
          platforms: "linux/amd64,linux/arm64"

          public-registry: ${{ env.PUBLIC_REGISTRY }}
          public-repo: ${{ vars.REPO || github.repository_owner }}
          public-username: ${{ github.actor }}
          public-password: ${{ secrets.GITHUB_TOKEN }}

          push-to-prime: false

  retag:
    permissions:
      packages: write
    runs-on: ubuntu-latest
    needs:
      - prebuild-env
      - publish-public
    container:
      image: ghcr.io/rancher/ci-image/charts:latest
    steps:
      - name: Re-tag the static head image using the rolling tag
        env:
          FULL_IMAGE_URL: ${{ env.PUBLIC_REGISTRY }}/${{ vars.REPO || github.repository_owner }}/${{ vars.IMAGE_NAME || 'kuberlr-kubectl' }}
          STATIC_TAG: ${{ needs.prebuild-env.outputs.branch_static_tag }}
          LATEST_TAG: ${{ needs.prebuild-env.outputs.branch_tag }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u ${{ github.actor }} --password-stdin
          oras copy ${{ env.FULL_IMAGE_URL }}:${{ env.STATIC_TAG }} ${{ env.FULL_IMAGE_URL }}:${{ env.LATEST_TAG }}
